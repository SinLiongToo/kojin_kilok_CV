<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>台灣跑步足跡地圖 (2024-0227~now)</title>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* ── DARK THEME (預設深色) ── */
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #334155;
  --border: #334155;
  --accent: #f97316; /* 跑步動態亮橘色 */
  --accent-glow: rgba(249, 115, 22, 0.35);
  --text: #f8fafc;
  --text-secondary: #94a3b8;
  --muted: #64748b;
  --danger: #ef4444;
  --success: #10b981;
  --map-bg: #0b0f19;
  --header-h: 52px;
  --sidebar-w: 320px;
  --sheet-peek: 110px;
  --sheet-mid: 55vh;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ── LIGHT THEME (淺色模式) ── */
[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --border: #e2e8f0;
  --accent: #ea580c;
  --accent-glow: rgba(234, 88, 12, 0.25);
  --text: #0f172a;
  --text-secondary: #475569;
  --muted: #64748b;
  --danger: #dc2626;
  --success: #059669;
  --map-bg: #e2e8f0;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  transition: background .25s, color .25s;
}

/* ═══ HEADER ═══ */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  transition: background .2s, border-color .2s;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 14px; color: var(--text);
}
.logo i { color: var(--accent); font-size: 16px; }
.logo-sub { font-size: 11px; color: var(--muted); font-weight: 400; }
.hdr-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.btn {
  border: none; border-radius: 6px; padding: 6px 11px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all .2s; white-space: nowrap;
}
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--border); }
.btn-ghost:active { opacity: .7; }
.btn-accent { background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow); }
.btn-accent:hover { opacity: .9; }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

#theme-btn {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  transition: background .2s; flex-shrink: 0; color: var(--text);
}
#theme-btn:hover { background: var(--border); }

/* ═══ MAP CONTAINER ═══ */
#map-wrap { position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0; }
#map { width: 100%; height: 100%; }

/* ═══ FAB (Mobile) ═══ */
#fab {
  position: fixed;
  bottom: calc(var(--sheet-peek) + 16px + var(--safe-bottom));
  right: 16px; z-index: 800;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px var(--accent-glow);
  transition: transform .15s, bottom .3s ease, background .2s;
  touch-action: manipulation; color: #fff; font-size: 18px;
}
#fab:active { transform: scale(.92); }
#file-input { display: none; }

/* ═══ SIDEBAR / SHEET ═══ */
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 850;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  border-top: 1px solid var(--border);
  transition: transform .3s cubic-bezier(.4,0,.2,1), background .2s, border-color .2s;
  transform: translateY(calc(100% - var(--sheet-peek) - var(--safe-bottom)));
  max-height: 90vh; display: flex; flex-direction: column; touch-action: none;
}
#sheet.mid  { transform: translateY(calc(100% - var(--sheet-mid))); }
#sheet.full { transform: translateY(0); }

.sheet-handle-row {
  padding: 8px 0 4px; display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0; cursor: grab;
}
.sheet-handle { width: 36px; height: 4px; border-radius: 99px; background: var(--border); }

.sheet-peek-content { padding: 8px 14px 10px; flex-shrink: 0; }
.sheet-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sheet-title { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
.track-badge {
  background: var(--accent); color: #fff;
  border-radius: 99px; font-size: 11px; font-weight: 700; padding: 1px 8px;
}

/* 統計資訊看板 */
.stats-dashboard {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 6px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  margin-bottom: 8px;
}
.sd-item { display: flex; flex-direction: column; text-align: center; }
.sd-label { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.sd-value { font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; color: var(--accent); margin-top: 1px; }

/* 搜尋框 */
.search-container {
  position: relative; margin: 0 14px 8px; flex-shrink: 0;
}
.search-container i {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: var(--muted);
}
.search-input {
  width: 100%; padding: 6px 10px 6px 28px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 11px; outline: none;
  transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent); }

/* 拖放上傳區 */
.drop-zone {
  margin: 0 14px 8px;
  border: 1.5px dashed var(--border); border-radius: 8px; padding: 10px;
  text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s;
  flex-shrink: 0; background: rgba(0,0,0,0.1);
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-glow); }
.drop-zone p { font-size: 11px; color: var(--text-secondary); }
.drop-zone strong { color: var(--accent); }

.sheet-divider { height: 1px; background: var(--border); flex-shrink: 0; }

/* 軌跡卡片清單 */
#track-list {
  flex: 1; min-height: 0; overflow-y: auto; padding: 6px 12px calc(var(--safe-bottom) + 16px);
}
#track-list::-webkit-scrollbar { width: 4px; }
#track-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.track-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 6px; position: relative;
  touch-action: manipulation; transition: all .2s ease; cursor: pointer;
}
.track-card:hover { border-color: var(--accent); transform: translateX(2px); }
.track-card.active { border-color: var(--accent); background: rgba(249, 115, 22, 0.08); }
.track-card.hidden-track { opacity: 0.45; }

.track-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.color-swatch { width: 3.5px; height: 32px; border-radius: 99px; flex-shrink: 0; }
.track-info { flex: 1; min-width: 0; }
.track-name {
  font-size: 12px; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; color: var(--text);
}
.track-sub { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
.track-actions { display: flex; gap: 4px; flex-shrink: 0; }

.icon-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 11px; color: var(--muted);
  touch-action: manipulation; transition: all .2s;
}
.icon-btn:hover { color: var(--text); border-color: var(--accent); }
.icon-btn.btn-remove:hover { color: var(--danger); border-color: var(--danger); }

.track-stats-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 4px; margin-top: 4px; padding-top: 4px; border-top: 1px dotted var(--border);
}
.tstat { display: flex; flex-direction: column; }
.tstat-label { font-size: 9px; color: var(--muted); }
.tstat-value { font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', Consolas, monospace; color: var(--text); }

.no-tracks { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 12px; }

/* ═══ DESKTOP (>= 768px) ═══ */
@media (min-width: 768px) {
  body {
    display: grid;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh; overflow: hidden;
  }
  #header { position: static; grid-column: 1 / -1; }
  #map-wrap { position: static; grid-row: 2; grid-column: 2; overflow: hidden; }
  #fab { display: none; }
  #sheet {
    position: static; grid-row: 2; grid-column: 1;
    border-radius: 0; border-top: none; border-right: 1px solid var(--border);
    transform: none !important; max-height: 100%; height: 100%;
    overflow: hidden;
  }
  .sheet-handle-row { display: none; }
  .sheet-peek-content { padding: 12px 14px 8px; }
  #desktop-import-btn { display: inline-flex !important; }
  #track-list { flex: 1; min-height: 0; overflow-y: auto; }
}

/* ═══ LEAFLET POPUP & CONTROLS ═══ */
.leaflet-container { background: var(--map-bg) !important; font-family: inherit; }
.leaflet-popup-content-wrapper {
  background: var(--surface) !important;
  color: var(--text) !important;
  border-radius: 8px !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3) !important;
  border: 1px solid var(--border) !important;
  font-size: 12px !important;
  line-height: 1.5 !important;
}
.leaflet-popup-tip { background: var(--surface) !important; }
.popup-title { font-weight: 700; color: var(--accent); margin-bottom: 4px; font-size: 13px; }
.popup-meta { color: var(--text-secondary); font-size: 11px; }

/* Custom Layer Switcher */
.leaflet-control-layers {
  background: var(--surface) !important;
  border: 1px solid var(--border) !important;
  border-radius: 6px !important;
  color: var(--text) !important;
  font-size: 12px !important;
}
</style>
</head>
<body>

<div id="header">
  <div class="logo">
    <i class="fa-solid fa-person-running"></i>
    <span>台灣跑步足跡地圖</span>
    <span class="logo-sub">(2024-0227~now)</span>
  </div>
  <div class="hdr-actions">
    <button class="btn btn-ghost" onclick="fitAll()" title="自動縮放至全部軌跡"><i class="fa-solid fa-expand"></i> 全景</button>
    <button class="btn btn-ghost" onclick="resetDefault()" title="恢復預設所有軌跡"><i class="fa-solid fa-rotate-left"></i> 重設</button>
    <button id="theme-btn" onclick="toggleTheme()" title="切換深色/淺色模式"><i class="fa-solid fa-moon"></i></button>
  </div>
</div>

<div id="map-wrap">
  <div id="map"></div>
</div>

<!-- Mobile FAB -->
<button id="fab" onclick="document.getElementById('file-input').click()" title="匯入 GPX 檔案">
  <i class="fa-solid fa-plus"></i>
</button>

<input type="file" id="file-input" accept=".gpx" multiple>

<!-- Sidebar / Bottom Sheet -->
<div id="sheet">
  <div class="sheet-handle-row" id="sheet-handle">
    <div class="sheet-handle"></div>
  </div>

  <div class="sheet-peek-content">
    <div class="sheet-title-row">
      <span class="sheet-title"><i class="fa-solid fa-route"></i> 跑步軌跡</span>
      <span class="track-badge" id="track-count">0</span>
      <div style="margin-left:auto;">
        <button class="btn btn-accent" id="desktop-import-btn" onclick="document.getElementById('file-input').click()" style="display:none;">
          <i class="fa-solid fa-file-arrow-up"></i> 匯入 GPX
        </button>
      </div>
    </div>

    <!-- 總覽數據看板 -->
    <div class="stats-dashboard" id="stats-dash">
      <div class="sd-item"><span class="sd-label">總里程</span><span class="sd-value" id="sb-dist">0 km</span></div>
      <div class="sd-item"><span class="sd-label">總爬升</span><span class="sd-value" id="sb-ele">0 m</span></div>
      <div class="sd-item"><span class="sd-label">總場次</span><span class="sd-value" id="sb-count">0 場</span></div>
      <div class="sd-item"><span class="sd-label">軌跡點</span><span class="sd-value" id="sb-pts">0</span></div>
    </div>
  </div>

  <!-- 搜尋過濾器 -->
  <div class="search-container">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="track-search" class="search-input" placeholder="搜尋軌跡名稱、日期或地點 (例如: XTRAIL、南區)..." oninput="filterTracks()">
  </div>

  <!-- 拖放上傳區 -->
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <p><i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent);margin-right:4px;"></i> 點擊或拖放 <strong>.gpx</strong> 檔案至此</p>
    <p style="font-size:10px;color:var(--muted);margin-top:2px;">支援多檔同時匯入，即時在地圖上疊加軌跡</p>
  </div>

  <div class="sheet-divider"></div>

  <!-- 軌跡卡片清單 -->
  <div id="track-list">
    <div class="no-tracks">載入軌跡中...</div>
  </div>
</div>

<!-- 預載入的預設 GPX 軌跡資料集 -->
<script src="running_tracks_data.js"></script>

<script>
// ── 顏色調色盤 (亮麗對比色) ─────────────────────────────────
const PALETTE = [
  '#f97316', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6',
  '#06b6d4', '#eab308', '#14b8a6', '#f43f5e', '#6366f1',
  '#84cc16', '#a855f7', '#0ea5e9', '#d946ef', '#22c55e',
  '#fb923c', '#38bdf8', '#4ade80', '#f472b6', '#a78bfa'
];

let isDark = true;
let currentTileLayer = null;
let layerControl = null;
let tracks = [];
let colorIdx = 0;
let searchQuery = '';

// ── 地圖圖層定義 ───────────────────────────────────────────
const darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OSM © CARTO', subdomains: 'abcd', maxZoom: 19
});
const lightTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OSM © CARTO', subdomains: 'abcd', maxZoom: 19
});
const taiwanTopo = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
  attribution: '© 國土測繪圖資服務雲', maxZoom: 19
});
const taiwanSat = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}', {
  attribution: '© 國土測繪圖資服務雲', maxZoom: 19
});

const baseMaps = {
  "深色底圖 (Dark)": darkTile,
  "淺色底圖 (Light)": lightTile,
  "臺灣通用電子地圖": taiwanTopo,
  "臺灣航照影像圖": taiwanSat
};

// ── 初始化地圖 (預設焦點於台灣南部與全島) ─────────────────
const map = L.map('map', { zoomControl: false, layers: [darkTile] }).setView([23.1, 120.5], 9);
L.control.zoom({ position: 'topright' }).addTo(map);
layerControl = L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

// ── 主題切換 ──────────────────────────────────────────────
function setTheme(dark) {
  isDark = dark;
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'light');
  const btn = document.getElementById('theme-btn');
  if (btn) btn.innerHTML = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
  
  if (isDark) {
    if (map.hasLayer(lightTile)) map.removeLayer(lightTile);
    if (!map.hasLayer(taiwanTopo) && !map.hasLayer(taiwanSat) && !map.hasLayer(darkTile)) {
      darkTile.addTo(map);
    }
  } else {
    if (map.hasLayer(darkTile)) map.removeLayer(darkTile);
    if (!map.hasLayer(taiwanTopo) && !map.hasLayer(taiwanSat) && !map.hasLayer(lightTile)) {
      lightTile.addTo(map);
    }
  }
}

function toggleTheme() {
  setTheme(!isDark);
}

// 監聽父視窗 postMessage 主題同步
window.addEventListener('message', (event) => {
  if (event.data && event.data.theme) {
    setTheme(event.data.theme === 'dark');
  }
});

// ── 距離計算輔助函數 ───────────────────────────────────────
function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

// ── 建立與加入軌跡至地圖 ───────────────────────────────────
function addTrackToMap(trackData, autoFit = false) {
  const color = PALETTE[colorIdx++ % PALETTE.length];
  const latLngs = trackData.path.map(p => [p[0], p[1]]);
  if (latLngs.length < 2) return null;

  const polyline = L.polyline(latLngs, {
    color: color,
    weight: 3.5,
    opacity: 0.85,
    lineJoin: 'round'
  }).addTo(map);

  // 起點與終點標記
  const startPt = latLngs[0];
  const endPt = latLngs[latLngs.length - 1];
  
  const startMarker = L.circleMarker(startPt, {
    radius: 4.5, fillColor: color, color: '#ffffff', weight: 1.5, fillOpacity: 1
  }).bindTooltip(`<b>起點: ${trackData.name}</b>`, { direction: 'top' });

  const endMarker = L.circleMarker(endPt, {
    radius: 4.5, fillColor: '#ffffff', color: color, weight: 2, fillOpacity: 1
  }).bindTooltip(`<b>終點: ${trackData.name}</b>`, { direction: 'top' });

  polyline.bindPopup(`
    <div class="popup-title"><i class="fa-solid fa-person-running"></i> ${trackData.name}</div>
    <div class="popup-meta">
      ${trackData.date ? `<b>日期：</b>${trackData.date}<br>` : ''}
      <b>總距離：</b>${trackData.dist} km<br>
      <b>總爬升：</b>${trackData.eleGain} m<br>
      <b>軌跡點：</b>${trackData.points.toLocaleString()} 點
    </div>
  `);

  const trackObj = {
    id: trackData.id || String(Date.now() + Math.random()),
    name: trackData.name,
    date: trackData.date || '',
    dist: trackData.dist,
    eleGain: trackData.eleGain,
    points: trackData.points,
    color: color,
    visible: true,
    layers: [polyline, startMarker, endMarker],
    bounds: polyline.getBounds()
  };

  tracks.push(trackObj);
  if (autoFit && trackObj.bounds) {
    map.fitBounds(trackObj.bounds, { padding: [40, 40] });
  }
  return trackObj;
}

// ── 載入預設軌跡資料 ───────────────────────────────────────
function loadDefaultTracks() {
  tracks.forEach(t => t.layers.forEach(l => map.removeLayer(l)));
  tracks = [];
  colorIdx = 0;

  if (window.DEFAULT_RUNNING_TRACKS && Array.isArray(window.DEFAULT_RUNNING_TRACKS)) {
    window.DEFAULT_RUNNING_TRACKS.forEach(t => addTrackToMap(t, false));
  }
  renderList();
  fitAll();
}

function resetDefault() {
  loadDefaultTracks();
}

// ── 渲染軌跡清單與統計數據 ─────────────────────────────────
function renderList() {
  const filtered = tracks.filter(t => {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (t.name && t.name.toLowerCase().includes(q)) ||
           (t.date && t.date.includes(q));
  });

  const visTracks = tracks.filter(t => t.visible);
  const totalDist = visTracks.reduce((s, t) => s + parseFloat(t.dist || 0), 0);
  const totalEle = visTracks.reduce((s, t) => s + parseInt(t.eleGain || 0), 0);
  const totalPts = visTracks.reduce((s, t) => s + (t.points || 0), 0);

  document.getElementById('track-count').textContent = tracks.length;
  document.getElementById('sb-dist').textContent = `${totalDist.toFixed(1)} km`;
  document.getElementById('sb-ele').textContent = `${totalEle.toLocaleString()} m`;
  document.getElementById('sb-count').textContent = `${visTracks.length} 場`;
  document.getElementById('sb-pts').textContent = totalPts.toLocaleString();

  const listEl = document.getElementById('track-list');
  if (!tracks.length) {
    listEl.innerHTML = '<div class="no-tracks">尚未載入任何軌跡 — 請點擊「+ 匯入 GPX」</div>';
    return;
  }
  if (!filtered.length) {
    listEl.innerHTML = '<div class="no-tracks">查無符合搜尋條件的軌跡</div>';
    return;
  }

  listEl.innerHTML = filtered.map(t => `
    <div class="track-card ${t.visible ? '' : 'hidden-track'}" data-id="${t.id}" onclick="zoomTo('${t.id}')">
      <div class="track-header">
        <div class="color-swatch" style="background:${t.color}"></div>
        <div class="track-info">
          <div class="track-name" title="${t.name}">${t.name}</div>
          <div class="track-sub">${t.date ? t.date + ' · ' : ''}${t.dist} km · ${t.eleGain} m 爬升</div>
        </div>
        <div class="track-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" onclick="toggleVis('${t.id}')" title="顯示/隱藏軌跡">
            <i class="fa-solid ${t.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
          </button>
          <button class="icon-btn btn-remove" onclick="removeTrack('${t.id}')" title="移除此軌跡">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div class="track-stats-grid">
        <div class="tstat"><span class="tstat-label">里程</span><span class="tstat-value">${t.dist} km</span></div>
        <div class="tstat"><span class="tstat-label">爬升</span><span class="tstat-value">${t.eleGain} m</span></div>
        <div class="tstat"><span class="tstat-label">點數</span><span class="tstat-value">${t.points.toLocaleString()}</span></div>
      </div>
    </div>
  `).join('');
}

function filterTracks() {
  searchQuery = document.getElementById('track-search').value.trim();
  renderList();
}

function zoomTo(id) {
  const t = tracks.find(item => item.id === id);
  if (t && t.bounds) {
    map.fitBounds(t.bounds, { padding: [40, 40], maxZoom: 15 });
    // Highlight track card
    document.querySelectorAll('.track-card').forEach(el => el.classList.remove('active'));
    const card = document.querySelector(`.track-card[data-id="${id}"]`);
    if (card) card.classList.add('active');
  }
}

function toggleVis(id) {
  const t = tracks.find(item => item.id === id);
  if (!t) return;
  t.visible = !t.visible;
  t.layers.forEach(l => {
    if (t.visible) {
      l.addTo(map);
    } else {
      map.removeLayer(l);
    }
  });
  renderList();
}

function removeTrack(id) {
  const t = tracks.find(item => item.id === id);
  if (!t) return;
  t.layers.forEach(l => map.removeLayer(l));
  tracks = tracks.filter(item => item.id !== id);
  renderList();
}

function fitAll() {
  const vis = tracks.filter(t => t.bounds && t.visible);
  if (!vis.length) return;
  let totalBounds = vis[0].bounds;
  vis.forEach(t => { totalBounds = totalBounds.extend(t.bounds); });
  map.fitBounds(totalBounds, { padding: [30, 30] });
}

// ── 動態匯入新 GPX 檔案處理 ───────────────────────────────
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  handleFiles([...e.dataTransfer.files]);
});

document.getElementById('file-input').addEventListener('change', e => {
  handleFiles([...e.target.files]);
  e.target.value = '';
});

function handleFiles(files) {
  const gpxFiles = files.filter(f => f.name.toLowerCase().endsWith('.gpx'));
  if (!gpxFiles.length) {
    alert('請選取 .gpx 格式的軌跡檔案！');
    return;
  }
  let loadedCount = 0;
  gpxFiles.forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      parseUploadedGPX(ev.target.result, f.name);
      loadedCount++;
      if (loadedCount === gpxFiles.length) {
        renderList();
        fitAll();
      }
    };
    reader.readAsText(f);
  });
}

function parseUploadedGPX(text, filename) {
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  const nameNode = xml.querySelector('name');
  const cleanName = nameNode ? nameNode.textContent.trim() : filename.replace(/\.gpx$/i, '').replace(/_/g, ' ');
  
  const trkpts = [...xml.querySelectorAll('trkpt')];
  if (!trkpts.length) {
    console.warn('GPX 檔案中無軌跡點：', filename);
    return;
  }

  const pts = trkpts.map(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    const eleEl = pt.querySelector('ele');
    const ele = eleEl ? parseFloat(eleEl.textContent) : 0;
    return [lat, lon, ele];
  });

  let dist = 0;
  let eleGain = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = haversine({ lat: pts[i-1][0], lng: pts[i-1][1] }, { lat: pts[i][0], lng: pts[i][1] });
    dist += d;
    const dele = pts[i][2] - pts[i-1][2];
    if (dele > 0.3) eleGain += dele;
  }

  const dateMatch = filename.match(/(202[4-6][\-_]?[0-1][0-9][\-_]?[0-3][0-9])/);
  const dateStr = dateMatch ? dateMatch[1].replace(/_/g, '-') : '';

  const trackData = {
    id: 'upload_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    name: cleanName,
    date: dateStr,
    dist: Math.round(dist * 100) / 100,
    eleGain: Math.round(eleGain),
    points: pts.length,
    path: pts
  };

  addTrackToMap(trackData, false);
}

// ── Mobile Bottom Sheet 手勢與互動 ─────────────────────────
const sheet = document.getElementById('sheet');
const handle = document.getElementById('sheet-handle');
let dragStartY = 0, dragStartState = 'peek';
const states = ['peek', 'mid', 'full'];

function getState() {
  if (sheet.classList.contains('full')) return 'full';
  if (sheet.classList.contains('mid')) return 'mid';
  return 'peek';
}
function setState(s) {
  sheet.classList.remove('peek', 'mid', 'full');
  sheet.classList.add(s);
  const fab = document.getElementById('fab');
  if (fab) {
    fab.style.bottom = s === 'full' ? 'calc(100vh - 52px)'
                     : s === 'mid' ? 'calc(55vh + 16px)'
                     : 'calc(var(--sheet-peek) + 16px + var(--safe-bottom))';
  }
}

if (handle) {
  handle.addEventListener('mousedown', e => { dragStartY = e.clientY; dragStartState = getState(); });
  document.addEventListener('mouseup', () => { dragStartY = 0; });
  handle.addEventListener('touchstart', e => { dragStartY = e.touches[0].clientY; dragStartState = getState(); }, { passive: true });
  handle.addEventListener('touchend', e => {
    const dy = dragStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy) < 20) { setState(states[(states.indexOf(dragStartState) + 1) % states.length]); }
    else if (dy > 40) { const i = states.indexOf(dragStartState); if (i < states.length - 1) setState(states[i + 1]); }
    else if (dy < -40) { const i = states.indexOf(dragStartState); if (i > 0) setState(states[i - 1]); }
  });
}

// ── 初始載入 ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadDefaultTracks();
  // 詢問父層主題
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'getTheme' }, '*');
  }
});
